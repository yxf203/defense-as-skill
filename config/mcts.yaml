# MCTS-style skill-evolution config.
# Main differences vs default.yaml:
#   * `mcts:` section points at the cheap/full eval jsonls produced by
#     the eval split lists shipped with the dataset (`split/`).
#   * `evaluation.subset` is still used only as a staging folder for parser
#     compatibility — the actual eval is driven by run_all_instances_mixed.sh
#     via the MctsLoop / InstanceEvaluator path.

paths:
  skill_guard_root: ./eval  # the bundled eval framework (run/subsets/scripts)
  original_skill_root: ./eval/safetySkill
  skill_bundle_name: skill-sonar
  active_deploy_root: ./eval/safetySkill
  evolution_root: .

evaluation:
  # Only used as a staging dir for the legacy subset parser. The actual cells
  # come from run_all_instances_mixed.sh via INSTANCES_JSONL.
  subset: mcts_staging
  bench_extra_args: []
  force_python_fallback: false
  per_cell_timeout_sec: 1800
  round_timeout_sec: 14400    # 4h — full eval over ~200 instances can be long.

# NOTE: `loop:` and `pool:` sections are intentionally omitted.
# MctsLoop never reads them — selection is UCT (`Tree.select_active`) and "best"
# comes straight off `Tree.best_full_evaluated()`. SkillManager only dereferences
# `cfg.pool.*` inside `score_for_balance` / `apply_pool_policy` / parent-picking
# helpers, none of which MCTS calls. config.py fills both sections with safe
# defaults when absent, so dropping them keeps this file honest about what MCTS
# actually uses. Put them back only if you run `python -m evolution.cli`
# (legacy flat-pool loop) against this file.

refiner:
  model: ""
  permission_mode: acceptEdits
  # Multi-variant refiner does more work in a single call, so give it more time.
  timeout_sec: 1800
  env: {}
  isolate_workspace: true

logging:
  console_level: INFO
  file_level: DEBUG
  keep_transcript: true

mcts:
  cheap_eval_instances_jsonl: ./eval/split/cheap_eval_instances.jsonl
  full_eval_instances_jsonl:  ./eval/split/full_eval_instances.jsonl
  k_children: 3
  c_uct: 0.7
  max_iterations: 10
  max_full_evals: 10
  asr_success_score: 0.9      # terminal if full-eval score >= this (asr <= 0.1)
  score_fn: asr_inv           # 1 - malicious_asr; alt: "guard_effective_rate"
  eval_jobs: 1                # parallel instances per subset run
  # Runtime resilience: retry whole eval pass when aggregate looks transient.
  runtime_transient_retries: 3
  runtime_retry_base_sec: 15
  runtime_retry_max_sec: 300
  runtime_transient_invalid_rate: 0.85
  # Backend health probe before retry delay. Empty -> fallback to refiner.env.ANTHROPIC_BASE_URL.
  backend_health_url: ""
  backend_health_poll_sec: 10
  backend_health_timeout_sec: 5
  backend_health_max_wait_sec: 900
