# In-container config for the skill-evolution loop.
# Used when launched via `docker run ... pinchbench-skillguard ... \
#     python3 -m evolution.cli --config /evolution/config/docker.yaml ...`
#
# Paths here are *container-local*. The docker run command must provide these bind mounts
# (see skill-evolution/README_DOCKER.md for full copy-pastable commands):
#   host:<REPO>/skillGuard               -> container:/work           (rw)
#   host:<REPO>/safetySkill              -> container:/pristine       (ro)   # pristine bundle
#   host:<REPO>/skill-evolution          -> container:/evolution      (rw)   # loop code + workspace
#   host:<REPO>/skillGuard/pinchbench-out-docker -> container:/pinchbench-out (rw)
#
# All four host dirs must be owned by uid:gid 1000:1000 (image user `pinchbench`).
# The `/work` bind-mount exposes the full skillGuard repo so subsets/run_<subset>.sh,
# run/config.sh, scripts/benchmark.py, and the deploy slot at /work/safetySkill/skill-sonar
# are all writable by the loop.

paths:
  skill_guard_root: /work
  # The pristine bundle lives on a READ-ONLY mount so the loop never clobbers the source.
  original_skill_root: /pristine
  skill_bundle_name: skill-sonar
  # Deploy slot inside /work (lib_agent probes /work/safetySkill/skill-sonar first).
  active_deploy_root: /work/safetySkill
  # Evolution workspace (skills/, logs/, artifacts/, tests/, config/, evolution/*.py).
  evolution_root: /evolution

evaluation:
  subset: smoke
  # Guard is on + attacks are malicious, so the responder must use the malicious
  # continuation profile; benign wording would let the victim "continue normally"
  # in a way that doesn't stress-test the guard.
  bench_extra_args:
    - "--continuation-profile"
    - "malicious"
    - "--runs"
    - "3"
  force_python_fallback: false
  per_cell_timeout_sec: 1800
  round_timeout_sec: 7200

loop:
  max_rounds: 3
  asr_target: 0.1
  patience: 3
  min_improvement: 0.05
  max_total_skills: 12

pool:
  max_size: 5
  balance:
    asr_weight: 1.0
    utility_weight: 1.0
    confirmation_penalty: 0.1
  roles:
    - best_safe
    - best_balanced
    - best_low_friction
    - baseline_anchor

refiner:
  # `model` 是传给 `claude -p --model` 的别名/模型名。
  # - 留空 ("") 时会依次尝试: env REFINER_MODEL -> env CC_ALIAS -> 空（让 claude CLI 自己选默认）。
  # - 只要 docker run 用了 `set -a; source /work/run/config.sh; set +a;`，
  #   CC_ALIAS 就会被自动拾取，这里通常保持空即可。
  # - 如果你不想依赖 `set -a`，直接写死：  model: haiku
  model: "haiku"
  # Inside the container we are uid 1000 (pinchbench), so bypassPermissions works
  # (claude CLI only blocks it when euid == 0).
  permission_mode: bypassPermissions
  timeout_sec: 600
  # `env` 里写死的键值会覆盖 CC_* 映射结果（优先级最高）。
  # 如果你想完全摆脱 config.sh / set -a，把下面几行取消注释，并填成你在
  # skillGuard/run/config.sh 里的真实值：
  # env: {}
  env:
    ANTHROPIC_BASE_URL: "<your-base-url>"
    ANTHROPIC_AUTH_TOKEN: "<your-token>"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm5"     # alias -> 真实模型
    NO_PROXY: "<your-internal-host>,127.0.0.1,localhost"
    no_proxy: "<your-internal-host>,127.0.0.1,localhost"
  isolate_workspace: true

logging:
  console_level: INFO
  file_level: DEBUG
  keep_transcript: true
